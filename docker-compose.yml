services:

  medgemma:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:bedbb0f38ff2c84893d2df350473fd438875d9ec23d23ce98e96df240e77d6ba
    container_name: medintel-medgemma
    restart: unless-stopped

    command:
      - --model
      - /models/medgemma-1.5-4b-it-q4_0.gguf
      - --alias
      - google/medgemma-1.5-4b-it
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --threads
      - "4"
      - --parallel
      - "1"

    volumes:
      - type: bind
        source: ${MEDGEMMA_MODEL_PATH}
        target: /models/medgemma-1.5-4b-it-q4_0.gguf
        read_only: true

    expose:
      - "8080"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      AI_REASONING_ENABLED: "true"
      AI_PROVIDER: "local"
      LOCAL_MEDGEMMA_MODEL_ID: "google/medgemma-1.5-4b-it"
      MEDGEMMA_BASE_URL: "http://medgemma:8080"
      MEDGEMMA_TIMEOUT_SECONDS: "360"
      MEDGEMMA_MAX_RETRIES: "0"

    depends_on:
      - db
      - medgemma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    depends_on:
      - backend

  db:
    image: postgres:15-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medintel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
